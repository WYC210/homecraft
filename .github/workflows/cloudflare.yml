# Deploy the static Homecraft site to Cloudflare Pages after pushes to the
# production branch. Wrangler creates the Pages project on the first deploy.
name: Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: bash tools/build.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run:
          npx --yes wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main || true
          npx --yes wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT"
